<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Vocab — DailyGrowth.os</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-800 antialiased flex flex-col md:flex-row min-h-screen">

    <aside id="sidebar-container" class="hidden md:flex md:w-64 md:flex-col md:fixed md:inset-y-0 bg-white border-r border-slate-200 z-30"></aside>

    <header class="md:hidden bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-30 flex items-center justify-between">
        <span class="font-bold text-slate-900">DailyGrowth<span class="text-indigo-600">.os</span></span>
        <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">Bank Vocab</span>
    </header>

    <main class="flex-1 md:pl-64 pb-24 md:pb-8">
        <div class="w-full p-3 sm:p-5 lg:p-6 fade-in">
            <div class="bg-white p-5 sm:p-7 rounded-2xl border border-slate-200 shadow-sm">
                <form id="vocab-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Kata Bahasa Inggris</label>
                        <input type="text" id="vocab-word" required placeholder="Contoh: cat, laptop, drink..."
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium">
                        <div id="auto-detect-badge" class="mt-2 hidden items-center gap-1.5 text-xs font-semibold text-indigo-700 bg-indigo-50 px-3 py-1.5 rounded-lg border border-indigo-100">
                            <i class="fa-solid fa-wand-magic-sparkles"></i>
                            <span id="auto-detect-text">Terdeteksi otomatis</span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Kategori (Otomatis / Manual)</label>
                        <select id="vocab-category" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium bg-white">
                            <option value="Benda / Barang">📦 Benda / Barang</option>
                            <option value="Hewan">🐾 Hewan</option>
                            <option value="Makanan & Minuman">🍔 Makanan & Minuman</option>
                            <option value="Kata Kerja (Verb)">⚡ Kata Kerja (Verb)</option>
                            <option value="Kata Sifat (Adjective)">✨ Kata Sifat (Adjective)</option>
                            <option value="Tempat & Alam">🌍 Tempat & Alam</option>
                            <option value="Umum / Lainnya">📝 Umum / Lainnya</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Arti Bahasa Indonesia</label>
                        <input type="text" id="vocab-meaning" required placeholder="Contoh: Kucing / Laptop"
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Contoh Kalimat Singkat</label>
                        <textarea id="vocab-example" rows="3" placeholder="Contoh: I bring my laptop to campus."
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"></textarea>
                    </div>

                    <button type="submit" id="btn-save-vocab" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm shadow-md shadow-indigo-200 transition-all">
                        Simpan ke Supabase
                    </button>
                </form>

                <div class="mt-5 pt-4 border-t border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <span id="vocab-count-summary" class="text-xs font-semibold text-slate-500">Total tersimpan: ...</span>
                    <a href="vocab-history.html" class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold transition-all">
                        <i class="fa-solid fa-clock-rotate-left text-indigo-600"></i>
                        <span>Lihat Halaman Riwayat Vocab</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <nav id="mobile-nav-container" class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 flex justify-around z-30"></nav>

    <div id="toast" class="fixed bottom-20 md:bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2.5 transform translate-y-24 opacity-0 transition-all duration-300 z-50">
        <i class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
        <span id="toast-message">Berhasil disimpan!</span>
    </div>

    <script type="module" src="vocab.js"></script>
</body>
</html>
