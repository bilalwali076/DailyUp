<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 Aturan Grammar — DailyGrowth.os</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-800 antialiased flex flex-col md:flex-row min-h-screen">

    <aside id="sidebar-container" class="hidden md:flex md:w-64 md:flex-col md:fixed md:inset-y-0 bg-white border-r border-slate-200 z-30"></aside>

    <header class="md:hidden bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-30 flex items-center justify-between">
        <span class="font-bold text-slate-900">DailyGrowth<span class="text-indigo-600">.os</span></span>
        <span class="text-xs font-semibold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full">Grammar</span>
    </header>

    <main class="flex-1 md:pl-64 pb-24 md:pb-10">
        <div class="max-w-6xl mx-auto p-4 sm:p-6 lg:p-8 fade-in">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-slate-900">Kurikulum Tahap 1: 5 Aturan Fundamental</h2>
                <p class="text-sm text-slate-500 mt-0.5">Kuasai satu per satu rumus di bawah ini. Status penguasaan tersimpan otomatis di Supabase.</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div id="grammar-rules-nav" class="space-y-3"></div>
                <div id="grammar-detail-card" class="lg:col-span-2 bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-sm"></div>
            </div>
        </div>
    </main>

    <nav id="mobile-nav-container" class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 flex justify-around z-30"></nav>

    <div id="toast" class="fixed bottom-20 md:bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2.5 transform translate-y-24 opacity-0 transition-all duration-300 z-50">
        <i class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
        <span id="toast-message">Status diperbarui!</span>
    </div>

    <script type="module" src="grammar.js"></script>
</body>
</html>
