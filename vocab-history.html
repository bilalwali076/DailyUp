<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Vocab — DailyGrowth.os</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-800 antialiased flex flex-col md:flex-row min-h-screen">

    <aside id="sidebar-container" class="hidden md:flex md:w-64 md:flex-col md:fixed md:inset-y-0 bg-white border-r border-slate-200 z-30"></aside>

    <header class="md:hidden bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-30 flex items-center justify-between">
        <span class="font-bold text-slate-900">DailyGrowth<span class="text-indigo-600">.os</span></span>
        <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">Riwayat Vocab</span>
    </header>

    <main class="flex-1 md:pl-64 pb-24 md:pb-10">
        <div class="max-w-5xl mx-auto p-4 sm:p-6 lg:p-8 fade-in">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-slate-900">Riwayat Kosakata (<span id="vocab-total-badge">0</span>)</h2>
                    <p class="text-sm text-slate-500 mt-0.5">Seluruh kosakata yang tersimpan di Supabase.</p>
                </div>
                <a href="vocab.html" class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-sm transition-all">
                    <i class="fa-solid fa-plus"></i>
                    <span>Kembali ke Input Vocab</span>
                </a>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                    <h3 class="font-bold text-slate-900">Daftar Kosakata</h3>
                    <select id="filter-vocab-category" class="px-3 py-2 rounded-lg border border-slate-200 text-xs font-semibold bg-slate-50">
                        <option value="ALL">Semua Kategori</option>
                        <option value="Benda / Barang">Benda / Barang</option>
                        <option value="Hewan">Hewan</option>
                        <option value="Makanan & Minuman">Makanan & Minuman</option>
                        <option value="Kata Kerja (Verb)">Kata Kerja (Verb)</option>
                        <option value="Kata Sifat (Adjective)">Kata Sifat (Adjective)</option>
                        <option value="Tempat & Alam">Tempat & Alam</option>
                        <option value="Umum / Lainnya">Umum / Lainnya</option>
                    </select>
                </div>
                <div id="vocab-list" class="space-y-3"></div>
            </div>
        </div>
    </main>

    <nav id="mobile-nav-container" class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 flex justify-around z-30"></nav>

    <div id="toast" class="fixed bottom-20 md:bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2.5 transform translate-y-24 opacity-0 transition-all duration-300 z-50">
        <i class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
        <span id="toast-message">Berhasil diperbarui!</span>
    </div>

    <script type="module" src="vocab-history.js"></script>
</body>
</html>
