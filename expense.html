<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengeluaran Harian — DailyGrowth.os</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        @media print {
            aside, header, nav, #toast, .no-print {
                display: none !important;
            }
            main {
                padding-left: 0 !important;
                padding-bottom: 0 !important;
            }
            body {
                background: #ffffff !important;
            }
        }
    </style>
</head>
<body class="text-slate-800 antialiased flex flex-col md:flex-row min-h-screen">

    <aside id="sidebar-container" class="hidden md:flex md:w-64 md:flex-col md:fixed md:inset-y-0 bg-white border-r border-slate-200 z-30"></aside>

    <header class="md:hidden bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-30 flex items-center justify-between">
        <span class="font-bold text-slate-900">DailyGrowth<span class="text-indigo-600">.os</span></span>
        <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full">Pengeluaran</span>
    </header>

    <main class="flex-1 md:pl-64 pb-24 md:pb-10">
        <div class="max-w-6xl mx-auto p-4 sm:p-6 lg:p-8 fade-in">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 no-print">
                <div>
                    <h2 class="text-2xl font-bold text-slate-900">Kontrol Pengeluaran Harian</h2>
                    <p class="text-sm text-slate-500 mt-0.5">Biasakan mencatat keterangan pengeluaran menggunakan bahasa Inggris.</p>
                </div>
                <div class="flex items-center gap-2 bg-white p-2 rounded-xl border border-slate-200 shadow-sm">
                    <span class="text-xs font-bold text-slate-500 pl-2">Batas/Hari:</span>
                    <input type="number" id="daily-limit-input" class="w-28 px-2.5 py-1 text-sm font-bold text-slate-900 bg-slate-50 rounded-lg border border-slate-200">
                    <button id="btn-save-limit" class="px-3 py-1 bg-slate-900 text-white text-xs font-bold rounded-lg hover:bg-slate-800">Set</button>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm h-fit no-print">
                    <h3 class="font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-receipt text-emerald-600"></i> Catat Pengeluaran
                    </h3>
                    <form id="expense-form" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Keterangan (B. Inggris)</label>
                            <input type="text" id="exp-title" required placeholder="Contoh: Buy lunch & iced tea"
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Nominal (Rp)</label>
                            <input type="number" id="exp-amount" required min="500" step="500" placeholder="Contoh: 15000"
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm font-bold">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Kategori</label>
                            <select id="exp-category" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm font-medium bg-white">
                                <option value="Makan & Minum">🍔 Makan & Minum</option>
                                <option value="Bensin & Transport">⛽ Bensin & Transport</option>
                                <option value="Kuliah & Tugas">📚 Kuliah & Tugas</option>
                                <option value="Paket Data / Pulsa">📱 Paket Data / Pulsa</option>
                                <option value="Lainnya">💸 Lainnya</option>
                            </select>
                        </div>

                        <button type="submit" id="btn-save-exp" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow-md shadow-emerald-200 transition-all">
                            Simpan Pengeluaran
                        </button>
                    </form>
                </div>

                <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                        <div class="flex flex-wrap items-center gap-2">
                            <h3 class="font-bold text-slate-900">Riwayat Pengeluaran</h3>
                            <select id="exp-history-period" class="no-print text-xs font-bold px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer">
                                <option value="monthly" selected>Per Bulan</option>
                                <option value="weekly">Per Minggu</option>
                                <option value="daily">Per Hari</option>
                                <option value="all">Semua</option>
                            </select>
                            <button type="button" id="btn-print-meal" class="no-print inline-flex items-center gap-1.5 text-xs font-bold px-3 py-1.5 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 transition-colors cursor-pointer">
                                <i class="fa-solid fa-utensils"></i>
                                <span>Cetak Makan</span>
                            </button>
                        </div>
                        <span id="exp-period-total" class="text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full">Bulan ini: Rp 0</span>
                    </div>
                    <div id="expense-list" class="space-y-3 max-h-[520px] overflow-y-auto pr-1"></div>
                </div>
            </div>
        </div>
    </main>

    <nav id="mobile-nav-container" class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 flex justify-around z-30"></nav>

    <div id="toast" class="fixed bottom-20 md:bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2.5 transform translate-y-24 opacity-0 transition-all duration-300 z-50">
        <i class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
        <span id="toast-message">Berhasil disimpan!</span>
    </div>

    <script type="module" src="expense.js"></script>
</body>
</html>
